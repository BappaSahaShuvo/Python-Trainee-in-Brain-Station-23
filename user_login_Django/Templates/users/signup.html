{% extends "users/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <h3>Signup</h3>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Signup</button>
    </form>
  </div>
</div>
{% endblock %}
