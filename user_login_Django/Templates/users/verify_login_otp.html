{% extends "users/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h4>OTP Verification (Login)</h4>
    <p>An OTP has been sent to your email. It is valid for <span id="remaining">{{ remaining }}</span> seconds.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Verify OTP</button>
    </form>
    <form method="post" action="{% url 'resend_login_otp' %}" class="mt-3">
      {% csrf_token %}
      <button id="resendBtn" class="btn btn-link" disabled style="display:none">Resend OTP</button>
    </form>
  </div>
</div>
{% block scripts %}
<script>
let remaining = parseInt('{{ remaining }}') || 0;
const remSpan = document.getElementById('remaining');
const resendBtn = document.getElementById('resendBtn');
function tick(){ if(remaining>0){ remaining-=1; remSpan.textContent=remaining; if(remaining<=0){resendBtn.style.display='inline-block';resendBtn.disabled=false;}}}
setInterval(tick,1000);
if(remaining<=0){resendBtn.style.display='inline-block';resendBtn.disabled=false;}
</script>
{% endblock %}
{% endblock %}
