<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>{% block title %}Brain Station 23{% endblock %}</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>.profile-pic{width:140px;height:140px;object-fit:cover;border-radius:50%;}</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Brain Station 23</a>
    <div class="ms-auto">
      {% if user.is_authenticated %}
        <a class="btn btn-outline-primary me-2" href="{% url 'profile' %}">Profile</a>
        <a class="btn btn-outline-danger" href="{% url 'logout' %}">Logout</a>
      {% else %}
        <a class="btn btn-primary me-2" href="{% url 'signup' %}">Signup</a>
        <a class="btn btn-success" href="{% url 'login' %}">Login</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
  {% if messages %}
    {% for m in messages %}
      <div class="alert alert-{{ m.tags|default:'info' }} alert-dismissible fade show">
        {{ m }}<button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endif %}
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
