{% extends "users/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Change Email</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Send OTP to new email</button>
    </form>
  </div>
</div>
{% endblock %}
