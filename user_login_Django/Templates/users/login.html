{% extends "users/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Login</h3>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-success">Login</button>
    </form>
    <p class="mt-3"><a href="{% url 'password_reset_request' %}">Forgot password?</a></p>
  </div>
</div>
{% endblock %}
