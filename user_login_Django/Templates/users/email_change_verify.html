{% extends "users/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Verify New Email</h3>
    <p>OTP valid for <span id="remaining">{{ remaining }}</span> seconds.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Verify</button>
    </form>
  </div>
</div>
{% endblock %}
