{% extends "users/base.html" %}
{% block content %}
<h3>Admin Notifications</h3>
<table class="table">
  <thead><tr><th>When</th><th>Message</th><th>Read</th></tr></thead>
  <tbody>
    {% for n in notes %}
      <tr>
        <td>{{ n.created_at }}</td>
        <td>{{ n.message }}</td>
        <td>{{ n.read }}</td>
      </tr>
    {% empty %}
      <tr><td colspan="3">No notifications</td></tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
