{% extends "users/base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h3>Password Reset - Enter OTP</h3>
    <p>OTP valid for <span id="remaining">{{ remaining }}</span> seconds.</p>
    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button class="btn btn-primary">Reset Password</button>
    </form>
  </div>
</div>
{% block scripts %}
<script>
let remaining = parseInt('{{ remaining }}') || 0;
const rem = document.getElementById('remaining');
function tick(){ if(remaining>0){ remaining--; rem.textContent = remaining; } }
setInterval(tick,1000);
</script>
{% endblock %}
{% endblock %}
