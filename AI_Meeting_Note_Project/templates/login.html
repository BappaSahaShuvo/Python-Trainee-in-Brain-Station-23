{% extends "base.html" %}
{% load static %}
{% block title %}Login{% endblock %}

{% block content %}
<style>
.login-bg {
    background-image: url("{% static 'images/LoginSignup.png' %}");
    height: 100vh;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
}
.form-card {
    background: rgba(0,0,0,0.75);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px #0ff;
    color: #fff;
    width: 100%;
    max-width: 400px;
}
.form-card input {
    border-radius: 8px;
    border: none;
    padding: 12px;
    margin-bottom: 15px;
}
.btn-login {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    background: linear-gradient(45deg,#0ff,#f0f,#ff0,#0f0);
    background-size: 300% 300%;
    animation: gradientBG 5s ease infinite, glow 1.5s ease-in-out infinite alternate;
    color: #fff;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}
.btn-login:hover { transform: scale(1.05); }
@keyframes gradientBG {0% {background-position:0% 50%;}50% {background-position:100% 50%;}100% {background-position:0% 50%;}}
@keyframes glow {0% {box-shadow:0 0 10px #0ff,0 0 20px #f0f;}100% {box-shadow:0 0 25px #0ff,0 0 50px #f0f;}}
.footer-login {text-align:center; margin-top:15px; font-size:14px; color:#fff;}
</style>

<div class="login-bg">
    <div class="form-card">
        <h2 class="mb-4 text-center">Login</h2>
        <form method="post">
            {% csrf_token %}
            {{ form.email.label_tag }}<input type="email" name="email" class="form-control" placeholder="Email" value="{{ form.email.value }}">
            {{ form.password.label_tag }}<input type="password" name="password" class="form-control" placeholder="Password">

            <button type="submit" class="btn-login mt-2">Login</button>
        </form>
        <div class="footer-login">Don't have an account? <a href="{% url 'signup' %}" style="color:#0ff;">Signup</a></div>
    </div>
</div>
{% endblock %}
