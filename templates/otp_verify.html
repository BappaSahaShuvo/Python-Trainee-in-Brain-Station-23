{% extends "base.html" %}
{% load static %}
{% block title %}OTP Verification{% endblock %}

{% block content %}
<style>
.otp-bg {
    background-image: url("{% static 'images/LoginSignup.png' %}");
    height: 100vh;
    background-size: cover;
    background-position: center;
    display: flex;
    justify-content: center;
    align-items: center;
}
.otp-card {
    background: rgba(0,0,0,0.75);
    padding: 40px;
    border-radius: 15px;
    box-shadow: 0 0 20px #0ff;
    color: #fff;
    width: 100%;
    max-width: 400px;
    text-align: center;
}
.otp-card input {
    border-radius: 8px;
    border: none;
    padding: 12px;
    margin-bottom: 15px;
    width: 100%;
    text-align: center;
}
.btn-otp {
    width: 100%;
    padding: 15px;
    font-size: 20px;
    background: linear-gradient(45deg,#0ff,#f0f,#ff0,#0f0);
    background-size: 300% 300%;
    animation: gradientBG 5s ease infinite, glow 1.5s ease-in-out infinite alternate;
    color: #fff;
    border-radius: 10px;
    border: none;
    cursor: pointer;
}
.btn-otp:hover { transform: scale(1.05); }
@keyframes gradientBG {0% {background-position:0% 50%;}50% {background-position:100% 50%;}100% {background-position:0% 50%;}}
@keyframes glow {0% {box-shadow:0 0 10px #0ff,0 0 20px #f0f;}100% {box-shadow:0 0 25px #0ff,0 0 50px #f0f;}}
.footer-otp {text-align:center; margin-top:15px; font-size:14px; color:#fff;}
.footer-otp form { display: inline; }
.footer-otp button { background:none; border:none; color:#0ff; text-decoration:underline; cursor:pointer; padding:0; font-size:14px; }
#countdown { font-size:16px; color:#0ff; margin-bottom: 10px; }
</style>

<div class="otp-bg">
    <div class="otp-card">
        <h2 class="mb-3">OTP Verification</h2>
        <p>Please enter the OTP sent to your email</p>

        <!-- Countdown timer -->
        <p id="countdown"></p>

        <form method="post" action="{% url 'verify_otp' %}">
            {% csrf_token %}
            <input type="text" name="otp" placeholder="Enter OTP" required maxlength="6">
            <button type="submit" class="btn-otp mt-2">Verify OTP</button>
        </form>
        <div class="footer-otp">
            Didn't receive OTP?
            <form method="post" action="{% url 'verify_otp' %}">
                {% csrf_token %}
                <button type="submit" name="resend">Resend</button>
            </form>
        </div>
    </div>
</div>

<script>
// Remaining time in seconds passed from Django view
let remaining = {{ remaining }};

function updateCountdown() {
    if (remaining > 0) {
        let minutes = Math.floor(remaining / 60);
        let seconds = remaining % 60;
        document.getElementById('countdown').textContent =
            `Time left: ${minutes}:${seconds.toString().padStart(2, '0')}`;
        remaining--;
    } else {
        document.getElementById('countdown').textContent = "OTP expired. Please resend.";
    }
}

// Update countdown every second
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
{% endblock %}
